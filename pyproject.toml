[project]
name = "nuclearshield"
version = "1.0.1"
description = "Defensive, read-only nuclear cybersecurity evidence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "prometheus-client==0.22.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.9", "bandit==1.8.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "monitoring*", "tests*"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.ruff]
line-length = 100
