name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m compileall -q src
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/nuclearshield.json > /dev/null
      - name: Validate readiness command
        run: python -m nuclearshield --self-check
      - name: Validate architecture and assurance modes
        run: |
          python -m nuclearshield --architecture
          python -m nuclearshield --assurance
          python -m nuclearshield --threat-context
      - name: Validate file-driven evidence analysis and export
        run: |
          python - <<'PY'
          import csv
          with open('/tmp/evidence.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['timestamp', 'network_connections', 'protocol_failures', 'configuration_drift'])
              for i in range(40):
                  w.writerow([f'2026-01-01T00:{i:02d}:00', 100+i, i % 3, i / 10])
          PY
          python -m nuclearshield --files /tmp/evidence.csv --export-report
