name: defensive-quality-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: bandit -q -r app -x app/static
      - run: pytest -q

